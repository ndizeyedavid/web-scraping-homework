<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraping Homework</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="top-header">
            <h4>Frontend Web Development</h4>
            <img src="images/alu.png" alt="ALU logo">
        </div>

        <h2 class="title">Assignments</h2>

        <div class="category-list">
            <button class="active">All</button>
            <button>Regular</button>
            <button>Intranet</button>
            <button>Quiz</button>
            <button>Resources</button>
            <button>Discussion</button>
        </div>

        <div class="search-container">
            <img src="images/search.svg" alt="search icon">
            <input type="text" class="search" placeholder="Search by assignment title...">
        </div>

        <div id="searchResults">
            Search results for "<span class="keyword">{text}</span>" returned <span class="results">{num}</span>
            results
        </div>
        <div id="noResults">
            <img src="images/no-results.png" alt="No assignments found matching your search.">
        </div>
        <section class="assignments-list">
            <div class="assignment-wrapper">
                <a href="#" class="learn-more">View <img src="images/send.svg" alt="icon"></a>
                <div class="single-assignment">

                    <div class="card-header">
                        <img src="images/intranet.svg" alt="assignment icon">
                        <div class="titles">
                            <h3>Assignment Title</h3>
                            <p>Facilitator</p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="pill-list">
                            <span class="pill">Some detail</span>
                            <span class="pill">Some detail</span>
                            <span class="pill">Some detail</span>
                        </div>

                        <p class="description">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Deleniti,
                            consequuntur.</p>
                    </div>

                    <div class="card-footer">
                        <span class="due-date">Due: 27 / 09 / 2026</span>

                        <span class="marks">0/100 pts</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
